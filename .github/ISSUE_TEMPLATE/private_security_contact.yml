name: Private security contact request (no details)
description: Use only when Private Vulnerability Reporting is unavailable. This issue must contain no vulnerability details.
title: '[PRIVATE SECURITY CONTACT] '
body:
  - type: markdown
    attributes:
      value: |
        First try [Private Vulnerability Reporting](https://github.com/genellect/compass-interactive/security/advisories/new). If that channel is unavailable, submit only this contact request. A maintainer will arrange a private channel. Do not include the affected component, impact, reproduction, exploit, screenshot, log, credential, personal data, or private lecture content here.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-issue safety
      options:
        - label: I have included no vulnerability or sensitive details in this public issue.
          required: true
