name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  quality:
    name: Quality and non-live regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run cloud:doctor
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run typecheck:phase3
      - run: npm run typecheck:e2e
      - run: npm run lint
      - run: npm run test:ci:nonlive
      - name: Build production feature topology
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_PDF_WORKER_BASE_URL: https://pdf.example
          VITE_PHASE1_SYNC_PROTOCOL: 'true'
          VITE_PHASE2_LECTURE_LIFECYCLE: 'true'
          VITE_PHASE3_PRIVATE_PDF: 'true'
          VITE_PHASE4_REALTIME_CAPTIONS: 'true'
          VITE_PHASE5_MATERIAL_ANALYSIS: 'true'
          VITE_PHASE6_SUMMARIES: 'true'
          VITE_PHASE6_5_COMMENT_NICKNAMES: 'true'
          VITE_PHASE6_6_UX_INTEGRATION: 'true'
          VITE_PHASE6_8_SECURITY: 'true'
          VITE_PHASE7_1_CLASSROOM_EXTENSIONS: 'true'
          VITE_PHASE7_2_ACADEMIC_ANSWERS: 'true'
          VITE_PHASE7_25_AUTO_ACADEMIC_ANSWERS: 'true'
          VITE_PHASE7_26_BROWSER_PDF_PUBLISHING: 'true'
          VITE_PHASE7_27_JOURNAL_CLUB: 'true'
          VITE_PHASE7_28_JOURNAL_CLUB_PRESET_CREATION: 'false'
          VITE_PHASE7_28_DISPLAY_REALTIME: 'false'
          VITE_PHASE7_28_AI_MASTER_AUTH: 'false'
          VITE_PHASE7_29_POWERPOINT_SYNC: 'false'
          VITE_PHASE7_30_ADMIN_IDENTITY: 'false'
          VITE_PHASE7_30_LEGACY_ADMIN_PIN: 'true'
        run: npm run build
      - run: npm run test:phase6-9-bundle
      - name: Generate CycloneDX SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/compass-sbom.cdx.json"
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: compass-sbom-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compass-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - run: git diff --check

  demo-e2e:
    name: Demo browser E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:demo:triple
      - run: npm run test:e2e:phase7-26
      - run: npm run test:e2e:phase7-26:flag-off
      - run: npm run test:e2e:phase7-27
      - run: npm run test:e2e:phase7-27:flag-off
      - run: npm run test:e2e:phase7-29:flag-off
      - run: npm run test:e2e:phase7-29
      - run: npm run test:e2e:phase7-30:flag-off
      - run: npm run test:e2e:phase7-30
      - name: Upload demo E2E evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: demo-e2e-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/demo/
          if-no-files-found: ignore
          retention-days: 7

  local-supabase:
    name: Local Supabase, pgTAP and live browser E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_ADMIN_PIN: '246810'
      TEST_ADMIN_SESSION_SECRET: compass-ci-only-admin-session-secret-2026-at-least-32-bytes
      TEST_BILLING_PIN: '135790'
      TEST_ALLOWED_ORIGIN: http://127.0.0.1:4173
      TEST_ADMIN_IDENTITY_PEPPER: compass-ci-only-admin-identity-pepper-at-least-32-bytes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Start isolated local Supabase
        run: npx supabase start

      - name: Apply every migration from zero
        run: npx supabase db reset --local --no-seed

      - name: Reject generated database type drift
        run: npm run db:types:check

      - name: Run pgTAP regression
        run: npx supabase test db --local

      - name: Run real-database AI concurrency regression
        run: npm run test:phase4-1-concurrency

      - name: Run lecture-wide AI authorization concurrency regression
        run: npm run test:phase7-28c-ai-concurrency

      - name: Run Display issue versus Admin revoke lock-order regression
        run: npm run test:phase7-28b-lock-order

      - name: Run real-database PDF publication concurrency regression
        run: npm run test:phase7-26-concurrency

      - name: Run real-database Journal Club concurrency regression
        run: npm run test:phase7-27-concurrency

      - name: Run real-database Presenter connection concurrency regression
        run: npm run test:phase7-29-concurrency

      - name: Run Admin AI unlock replay and lock-order concurrency regression
        run: npm run test:phase7-30b2-concurrency

      - name: Verify Phase 7.2 data upgrade through Phase 7.26
        run: npm run test:phase7-26-upgrade

      - name: Verify Phase 7.26 data upgrade through Phase 7.27
        run: npm run test:phase7-27-upgrade

      - name: Verify populated Phase 7.27 upgrade through Phase 7.28
        run: npm run test:phase7-28-upgrade

      - name: Verify populated Phase 7.28 upgrade through Phase 7.29
        run: npm run test:phase7-29-upgrade

      - name: Verify populated Phase 7.29, B1 and B2-head states through Phase 7.30 B2.2a
        run: npm run test:phase7-30-upgrade

      - name: Lint the local database
        run: npx supabase db lint --local --fail-on error

      - name: Export local-only browser variables
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          local_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "$local_key"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local Supabase URL" >&2; exit 1 ;;
          esac
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$local_key" >> "$GITHUB_ENV"

      - name: Start local Edge Functions with synthetic test secrets
        shell: bash
        run: |
          set -euo pipefail
          edge_env="$RUNNER_TEMP/compass-edge.env"
          cat > "$edge_env" <<'EOF'
          ADMIN_PIN=246810
          ADMIN_SESSION_SECRET=compass-ci-only-admin-session-secret-2026-at-least-32-bytes
          PHASE68_TRACKED_ADMIN_SESSIONS_ENABLED=true
          PHASE68_RESUME_TOKENS_ENABLED=true
          LECTURE_RESUME_TOKEN_SECRET=compass-ci-only-lecture-resume-token-secret-at-least-32-bytes
          BILLING_PIN=135790
          COMPASS_EDGE_ALLOWED_ORIGINS=http://127.0.0.1:4173
          PHASE4_REALTIME_CAPTIONS_ENABLED=true
          PHASE5_MATERIAL_ANALYSIS_ENABLED=true
          PHASE6_SUMMARIES_ENABLED=true
          PHASE7_1_CLASSROOM_EXTENSIONS_ENABLED=true
          PHASE7_2_ACADEMIC_ANSWERS_ENABLED=true
          PHASE7_25_AUTO_ACADEMIC_ANSWERS_ENABLED=true
          PHASE726_BROWSER_PDF_PUBLICATION_ENABLED=true
          PHASE7_27_JOURNAL_CLUB_ENABLED=true
          PHASE7_28_JOURNAL_CLUB_PRESET_CREATION_ENABLED=true
          PHASE728_DISPLAY_REALTIME_ENABLED=true
          PHASE7_28_AI_MASTER_AUTH_ENABLED=true
          PHASE729_POWERPOINT_SYNC_ENABLED=false
          PHASE730_ADMIN_IDENTITY_ENABLED=false
          PHASE730_LEGACY_ADMIN_PIN_ENABLED=true
          PHASE730_ADMIN_ENVIRONMENT_ID=00000000-0000-4000-8000-000000000730
          ADMIN_IDENTITY_PEPPER_VERSION=1
          PRESENTER_BRIDGE_TOKEN_SECRET=compass-ci-only-presenter-bridge-token-secret-at-least-32-bytes
          PRESENTER_BRIDGE_GATEWAY_SECRET=compass-ci-only-presenter-gateway-secret-at-least-32-bytes
          LITERATURE_API_CONTACT_EMAIL=ci@example.test
          EOF
          printf 'ADMIN_IDENTITY_PEPPER=%s\n' "$TEST_ADMIN_IDENTITY_PEPPER" >> "$edge_env"
          node --input-type=module -e "const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']); console.log('PDF_ACCESS_PRIVATE_JWK=' + JSON.stringify(await crypto.subtle.exportKey('jwk', pair.privateKey)))" >> "$edge_env"
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Verify local Auth, CORS and fail-closed paid features
        run: npm run test:production-local-edge

      - name: Restart local Edge Functions with Admin identity enabled
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-admin-identity-edge.mjs on
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for Admin-identity-enabled local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run local GoTrue TOTP and signed Google identity through Edge and database
        run: npm run test:phase7-30b1-local-edge

      - name: Restore dormant Admin identity configuration
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-admin-identity-edge.mjs off
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for dormant Admin identity configuration
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Restart local Edge Functions with Presenter proof enabled
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-presenter-edge.mjs on
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for Presenter-enabled local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run Presenter proof through the real local Edge and database
        env:
          PRESENTER_BRIDGE_GATEWAY_SECRET: compass-ci-only-presenter-gateway-secret-at-least-32-bytes
          PRESENTER_BRIDGE_TOKEN_SECRET: compass-ci-only-presenter-bridge-token-secret-at-least-32-bytes
        run: npm run test:phase7-29c-local-edge

      - name: Restore dormant Presenter Edge configuration
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-presenter-edge.mjs off
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for dormant local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run Journal Club browser-to-Edge-to-database integration
        run: npm run test:e2e:phase7-27:local

      - name: Restart local Edge Functions before Display Realtime integration
        run: node scripts/ci/manage-local-edge.mjs restart

      - name: Wait for restarted local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run private cross-browser Display Realtime integration
        run: npm run test:e2e:phase7-28b:local

      - name: Run lecture-wide AI authorization browser integration
        run: npm run test:e2e:phase7-28c:local

      - name: Restore a clean database before general lifecycle E2E
        run: npx supabase db reset --local --no-seed

      - name: Wait for local Auth after database reset
        run: node scripts/ci/wait-for-local-auth.mjs

      - name: Run teacher-student browser lifecycle three times
        run: npm run test:e2e:local:triple

      - name: Upload local integration evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: local-integration-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/local/
            ${{ runner.temp }}/compass-edge.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Edge Functions
        if: always()
        run: node scripts/ci/manage-local-edge.mjs stop

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  presenter-native:
    name: Presenter Bridge Windows ${{ matrix.platform }} build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: presenter-bridge/global.json
          architecture: ${{ matrix.platform }}
      - name: Verify pinned .NET SDK
        shell: pwsh
        run: |
          $actualVersion = dotnet --version
          if ($actualVersion -ne '10.0.302') {
            throw "Expected .NET SDK 10.0.302 but found $actualVersion."
          }
      - name: Reject stale local Edge PID reuse
        if: matrix.platform == 'x64'
        run: node scripts/ci/test-manage-local-edge-pid.mjs
      - name: Restore native solution
        run: dotnet restore presenter-bridge/Compass.PresenterBridge.slnx --locked-mode
      - name: Build native solution without publishing an artifact
        run: dotnet build presenter-bridge/Compass.PresenterBridge.slnx --configuration Release --no-restore -p:PlatformTarget=${{ matrix.platform }}
      - name: Run deterministic Core and loopback tests
        run: dotnet run --project presenter-bridge/tests/Compass.Presenter.Tests/Compass.Presenter.Tests.csproj --configuration Release --no-build -p:PlatformTarget=${{ matrix.platform }}
      - run: git diff --check

  dependency-review:
    name: Dependency review
    # GitHub Dependency Review requires the dependency graph and GitHub
    # Advanced Security for private repositories. npm audit remains the
    # fail-closed dependency gate unless this repository becomes public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development

  codeql:
    name: CodeQL JavaScript and TypeScript
    # Private repositories require GitHub Code Scanning/Advanced Security.
    # Keep the pinned job ready without turning a billing-controlled feature on.
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
