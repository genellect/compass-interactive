name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a documentation-only pull request
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_path_file="$RUNNER_TEMP/ci-changed-paths"
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_path_file"
            git diff --check "$BASE_SHA...$HEAD_SHA"
            mapfile -d '' changed_paths < "$changed_path_file"
            if (( ${#changed_paths[@]} > 0 )); then
              docs_only=true
              for path in "${changed_paths[@]}"; do
                case "$path" in
                  README.md|PROJECT_GUIDE.md|MVP_REQUIREMENTS.md|AGENTS.md|CLAUDE.md|CLA.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|TRADEMARKS.md|THIRD_PARTY_NOTICES.md|LICENSE|NOTICE|docs/*.md|.github/*.md|.claude/*.md|presenter-bridge/README.md|supabase/manual/README.md) ;;
                  *) docs_only=false; break ;;
                esac
              done
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality and non-live regression
    needs: classify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require successful scope classification
        if: needs.classify.result != 'success'
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact dependencies and run security:audit once
        if: needs.classify.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --json --audit --color=false |
            node scripts/ci/verify-npm-ci-audit.mjs
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run cloud:doctor
      - run: npm run security:secrets
      - name: Verify the documentation contract
        if: needs.classify.outputs.docs_only == 'true'
        run: npm run test:phase6-7-docs
      - if: needs.classify.outputs.docs_only != 'true'
        run: node scripts/cloud-handoff-doctor.mjs --contract-only
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run typecheck
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run typecheck:phase3
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run typecheck:e2e
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run lint
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run test:ci:nonlive
      - name: Build production feature topology
        if: needs.classify.outputs.docs_only != 'true'
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_PDF_WORKER_BASE_URL: https://pdf.example
          VITE_PHASE1_SYNC_PROTOCOL: 'true'
          VITE_PHASE2_LECTURE_LIFECYCLE: 'true'
          VITE_PHASE3_PRIVATE_PDF: 'true'
          VITE_PHASE4_REALTIME_CAPTIONS: 'true'
          VITE_PHASE5_MATERIAL_ANALYSIS: 'true'
          VITE_PHASE6_SUMMARIES: 'true'
          VITE_PHASE6_5_COMMENT_NICKNAMES: 'true'
          VITE_PHASE6_6_UX_INTEGRATION: 'true'
          VITE_PHASE6_8_SECURITY: 'true'
          VITE_PHASE7_1_CLASSROOM_EXTENSIONS: 'true'
          VITE_PHASE7_2_ACADEMIC_ANSWERS: 'true'
          VITE_PHASE7_25_AUTO_ACADEMIC_ANSWERS: 'true'
          VITE_PHASE7_26_BROWSER_PDF_PUBLISHING: 'true'
          VITE_PHASE7_27_JOURNAL_CLUB: 'true'
          VITE_PHASE7_28_JOURNAL_CLUB_PRESET_CREATION: 'false'
          VITE_PHASE7_28_DISPLAY_REALTIME: 'false'
          VITE_PHASE7_29_POWERPOINT_SYNC: 'false'
          VITE_PHASE7_30_ADMIN_IDENTITY: 'false'
          VITE_PHASE7_30_ADMIN_AI_UNLOCK: 'false'
          VITE_PHASE7_30_ADMIN_TOTP_FACTOR_MUTATION: 'false'
          VITE_PHASE7_30_GOOGLE_ADMIN_OPERATIONS: 'false'
          VITE_PHASE7_30_GOOGLE_ADMIN_LEDGER: 'false'
        run: npm run build
      - if: needs.classify.outputs.docs_only != 'true'
        run: npm run test:phase6-9-bundle
      - name: Generate CycloneDX SBOM
        if: needs.classify.outputs.docs_only != 'true'
        shell: bash
        run: npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/compass-sbom.cdx.json"
      - name: Upload SBOM evidence
        if: ${{ needs.classify.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: compass-sbom-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compass-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - run: git diff --check

  demo-e2e:
    name: Demo browser E2E
    needs: [classify, quality]
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:demo:triple
      - run: npm run test:e2e:phase7-26
      - run: npm run test:e2e:phase7-26:flag-off
      - run: npm run test:e2e:phase7-27
      - run: npm run test:e2e:phase7-27:flag-off
      - run: npm run test:e2e:phase7-29:flag-off
      - run: npm run test:e2e:phase7-29
      - run: npm run test:e2e:phase7-30:flag-off
      - run: npm run test:e2e:phase7-30
      - run: npm run test:e2e:phase7-30b22b-browser
      - run: npm run test:e2e:phase7-30d-browser
      - name: Upload demo E2E evidence
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: demo-e2e-evidence-${{ github.run_attempt }}
          path: |
            test-results/demo/
            test-results/reports/demo/
          if-no-files-found: ignore
          retention-days: 7

  local-supabase:
    name: Local Supabase, pgTAP and live browser E2E
    needs: [classify, quality]
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_ADMIN_SESSION_SECRET: compass-ci-only-admin-session-secret-2026-at-least-32-bytes
      TEST_ALLOWED_ORIGIN: http://127.0.0.1:4173
      TEST_ADMIN_IDENTITY_PEPPER: compass-ci-only-admin-identity-pepper-at-least-32-bytes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start isolated local Supabase
        run: npx supabase start

      - name: Apply every migration from zero
        run: npx supabase db reset --local --no-seed

      - name: Reject generated database type drift
        run: npm run db:types:check

      - name: Run pgTAP regression
        run: npx supabase test db --local

      - name: Run real-database AI concurrency regression
        run: npm run test:phase4-1-concurrency

      - name: Run lecture-wide AI authorization concurrency regression
        run: npm run test:phase7-28c-ai-concurrency

      - name: Run Display issue versus Admin revoke lock-order regression
        run: npm run test:phase7-28b-lock-order

      - name: Run real-database PDF publication concurrency regression
        run: npm run test:phase7-26-concurrency

      - name: Run real-database Journal Club concurrency regression
        run: npm run test:phase7-27-concurrency

      - name: Run real-database Presenter connection concurrency regression
        run: npm run test:phase7-29-concurrency

      - name: Run Presenter bound authority and terminal lease concurrency regression
        # Earlier concurrency tests retain terminal Admin/AI audit fixtures.
        run: |
          npx supabase db reset --local --no-seed
          npm exec -- node scripts/test-presenter-authority-concurrency.mjs

      - name: Run Admin AI unlock replay and lock-order concurrency regression
        run: npm run test:phase7-30b2-concurrency

      - name: Verify Phase 7.2 data upgrade through Phase 7.26
        run: npm run test:phase7-26-upgrade

      - name: Verify Phase 7.26 data upgrade through Phase 7.27
        run: npm run test:phase7-27-upgrade

      - name: Verify populated Phase 7.27 upgrade through Phase 7.28
        run: npm run test:phase7-28-upgrade

      - name: Verify populated Phase 7.28 upgrade through Phase 7.29
        run: npm run test:phase7-29-upgrade

      - name: Run Admin ledger terminal-state and owner-invariant concurrency regression
        run: npm run test:phase7-30d-concurrency

      - name: Verify populated Phase 7.29 through Phase 7.30 C2 provider upgrades
        run: npm run test:phase7-30-upgrade

      - name: Run Google-only Admin cutover serialization and writer-fence regression
        run: npm run test:phase7-30e-concurrency

      - name: Verify populated Google Admin upgrade preserves Presenter authority and gate state
        run: npm exec -- node scripts/test-presenter-authority-upgrade.mjs

      - name: Lint the local database
        run: npx supabase db lint --local --fail-on error

      - name: Export local-only browser variables
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          local_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "$local_key"
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local Supabase URL" >&2; exit 1 ;;
          esac
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$local_key" >> "$GITHUB_ENV"

      - name: Start local Edge Functions with synthetic test secrets
        shell: bash
        run: |
          set -euo pipefail
          edge_env="$RUNNER_TEMP/compass-edge.env"
          cat > "$edge_env" <<'EOF'
          ADMIN_SESSION_SECRET=compass-ci-only-admin-session-secret-2026-at-least-32-bytes
          PHASE68_RESUME_TOKENS_ENABLED=true
          LECTURE_RESUME_TOKEN_SECRET=compass-ci-only-lecture-resume-token-secret-at-least-32-bytes
          COMPASS_EDGE_ALLOWED_ORIGINS=http://127.0.0.1:4173
          PHASE4_REALTIME_CAPTIONS_ENABLED=true
          PHASE5_MATERIAL_ANALYSIS_ENABLED=true
          PHASE6_SUMMARIES_ENABLED=true
          PHASE7_1_CLASSROOM_EXTENSIONS_ENABLED=true
          PHASE7_2_ACADEMIC_ANSWERS_ENABLED=true
          PHASE7_25_AUTO_ACADEMIC_ANSWERS_ENABLED=true
          PHASE726_BROWSER_PDF_PUBLICATION_ENABLED=true
          PHASE7_27_JOURNAL_CLUB_ENABLED=true
          PHASE7_28_JOURNAL_CLUB_PRESET_CREATION_ENABLED=true
          PHASE728_DISPLAY_REALTIME_ENABLED=true
          PHASE729_POWERPOINT_SYNC_ENABLED=false
          PHASE730_ADMIN_IDENTITY_ENABLED=true
          PHASE730_ADMIN_AI_UNLOCK_ENABLED=true
          PHASE730_ADMIN_TOTP_FACTOR_MUTATION_ENABLED=false
          PHASE730_C1_GOOGLE_AI_MASTER_ENABLED=true
          PHASE730_GOOGLE_ADMIN_OPERATIONS_ENABLED=true
          PHASE730_GOOGLE_ADMIN_LEDGER_ENABLED=false
          PHASE730_ADMIN_ENVIRONMENT_ID=00000000-0000-4000-8000-000000000730
          ADMIN_IDENTITY_PEPPER_VERSION=1
          ADMIN_AI_PIN_PEPPER_VERSION=1
          ADMIN_AI_PIN_PEPPER=compass-ci-only-admin-ai-pin-pepper-at-least-32-bytes
          ADMIN_AI_NETWORK_PEPPER=compass-ci-only-admin-ai-network-pepper-at-least-32-bytes
          ADMIN_AI_BROWSER_CHALLENGE_SECRET=compass-ci-only-browser-challenge-secret-at-least-32-bytes
          ADMIN_AI_CHILD_GRANT_SECRET=compass-ci-only-admin-ai-child-grant-secret-at-least-32-bytes
          ADMIN_AI_CHILD_GRANT_SECRET_VERSION=1
          PRESENTER_BRIDGE_TOKEN_SECRET=compass-ci-only-presenter-bridge-token-secret-at-least-32-bytes
          PRESENTER_BRIDGE_GATEWAY_SECRET=compass-ci-only-presenter-gateway-secret-at-least-32-bytes
          LITERATURE_API_CONTACT_EMAIL=ci@example.test
          EOF
          printf 'ADMIN_IDENTITY_PEPPER=%s\n' "$TEST_ADMIN_IDENTITY_PEPPER" >> "$edge_env"
          node --input-type=module -e "const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']); console.log('PDF_ACCESS_PRIVATE_JWK=' + JSON.stringify(await crypto.subtle.exportKey('jwk', pair.privateKey)))" >> "$edge_env"
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Verify local Auth, CORS and fail-closed paid features
        run: npm run test:production-local-edge

      - name: Run local GoTrue TOTP and signed Google identity through Edge and database, then gate-closed factor checks
        run: npm run test:phase7-30b1-local-edge

      - name: Restart local Edge Functions with Presenter proof enabled
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-presenter-edge.mjs on
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for Presenter-enabled local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run Presenter proof through the real local Edge and database
        env:
          PRESENTER_BRIDGE_GATEWAY_SECRET: compass-ci-only-presenter-gateway-secret-at-least-32-bytes
          PRESENTER_BRIDGE_TOKEN_SECRET: compass-ci-only-presenter-bridge-token-secret-at-least-32-bytes
        run: npm run test:phase7-29c-local-edge

      - name: Restore dormant Presenter Edge configuration
        run: |
          node scripts/ci/manage-local-edge.mjs stop
          node scripts/ci/set-local-presenter-edge.mjs off
          node scripts/ci/manage-local-edge.mjs start

      - name: Wait for dormant local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run Journal Club browser-to-Edge-to-database integration
        run: npm run test:e2e:phase7-27:local

      - name: Restart local Edge Functions before Display Realtime integration
        run: node scripts/ci/manage-local-edge.mjs restart

      - name: Wait for restarted local Edge Functions
        run: node scripts/ci/wait-for-local-edge.mjs

      - name: Run private cross-browser Display Realtime integration
        run: npm run test:e2e:phase7-28b:local

      - name: Run lecture-wide AI authorization browser integration
        run: npm run test:e2e:phase7-28c:local

      - name: Restore a clean database before general lifecycle E2E
        run: npx supabase db reset --local --no-seed

      - name: Restart local Auth after database reset
        run: node scripts/ci/restart-local-auth.mjs

      - name: Wait for local Auth after database reset
        run: node scripts/ci/wait-for-local-auth.mjs

      - name: Run teacher-student browser lifecycle three times
        run: npm run test:e2e:local:triple

      - name: Upload local integration evidence
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: local-integration-evidence-${{ github.run_attempt }}
          path: |
            test-results/local/
            test-results/reports/local/
            ${{ runner.temp }}/compass-edge.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Edge Functions
        if: always()
        run: node scripts/ci/manage-local-edge.mjs stop

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  presenter-native:
    name: Presenter Bridge Windows ${{ matrix.platform }} build and tests
    needs: classify
    if: ${{ always() }}
    runs-on: ${{ needs.classify.outputs.docs_only == 'true' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 20
    env:
      RUN_NATIVE: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - name: Require successful scope classification
        if: needs.classify.result != 'success'
        run: exit 1
      - name: Record the documentation-only fast path
        if: needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true'
        run: echo "No Presenter Bridge source changed."
      - name: Checkout without persisted credentials
        if: env.RUN_NATIVE == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        if: env.RUN_NATIVE == 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: presenter-bridge/global.json
          architecture: ${{ matrix.platform }}
      - name: Verify global.json .NET SDK feature band
        if: env.RUN_NATIVE == 'true'
        shell: pwsh
        working-directory: presenter-bridge
        run: |
          $sdkPolicy = Get-Content global.json -Raw | ConvertFrom-Json
          if ($sdkPolicy.sdk.rollForward -ne 'latestPatch') {
            throw "Expected global.json rollForward latestPatch."
          }
          $requestedVersion = [Version]$sdkPolicy.sdk.version
          $actualVersionText = dotnet --version
          $actualVersion = [Version]$actualVersionText
          $requestedFeatureBand = [Math]::Floor($requestedVersion.Build / 100) * 100
          $actualFeatureBand = [Math]::Floor($actualVersion.Build / 100) * 100
          if (
            $actualVersion.Major -ne $requestedVersion.Major -or
            $actualVersion.Minor -ne $requestedVersion.Minor -or
            $actualFeatureBand -ne $requestedFeatureBand -or
            $actualVersion.Build -lt $requestedVersion.Build
          ) {
            throw "Expected .NET SDK $($sdkPolicy.sdk.version) latestPatch feature band but found $actualVersionText."
          }
      - name: Reject stale local Edge PID reuse
        if: env.RUN_NATIVE == 'true' && matrix.platform == 'x64'
        run: node scripts/ci/test-manage-local-edge-pid.mjs
      - name: Restore native solution
        if: env.RUN_NATIVE == 'true'
        working-directory: presenter-bridge
        run: dotnet restore Compass.PresenterBridge.slnx --locked-mode
      - name: Build native solution without publishing an artifact
        if: env.RUN_NATIVE == 'true'
        working-directory: presenter-bridge
        run: dotnet build Compass.PresenterBridge.slnx --configuration Release --no-restore -p:PlatformTarget=${{ matrix.platform }}
      - name: Run deterministic Core and loopback tests
        if: env.RUN_NATIVE == 'true'
        working-directory: presenter-bridge
        run: dotnet run --project tests/Compass.Presenter.Tests/Compass.Presenter.Tests.csproj --configuration Release --no-build -p:PlatformTarget=${{ matrix.platform }}
      - name: Validate the pinned release packager and self-contained payload
        if: env.RUN_NATIVE == 'true' && matrix.platform == 'x64'
        shell: pwsh
        working-directory: presenter-bridge
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Pinned packager restore failed.' }
          dotnet tool run vpk -- --help
          if ($LASTEXITCODE -ne 0) { throw 'Pinned packager could not start.' }
          dotnet restore src/Compass.Presenter.App/Compass.Presenter.App.csproj --runtime win-x64 --locked-mode -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { throw 'Release runtime restore failed.' }
          dotnet publish src/Compass.Presenter.App/Compass.Presenter.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PlatformTarget=x64 --output "$env:RUNNER_TEMP/presenter-unsigned-payload"
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained payload build failed.' }
          foreach ($file in Get-ChildItem -LiteralPath scripts -File -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw "Invalid release script: $($file.Name)" }
          }
      - if: env.RUN_NATIVE == 'true'
        run: git diff --check

  dependency-review:
    name: Dependency review
    # Public pull requests add a diff-specific review to the full-lockfile
    # fail-closed audit performed once during the quality install.
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.repository.visibility == 'public' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development

  codeql:
    name: CodeQL JavaScript and TypeScript
    # Private repositories require GitHub Code Scanning/Advanced Security.
    # Keep the pinned job ready without turning a billing-controlled feature on.
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && vars.CODEQL_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
