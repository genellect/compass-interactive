name: Dev Container Contract

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .codex/**
      - .claude/**
      - AGENTS.md
      - CLAUDE.md
      - .github/copilot-instructions.md
      - .gitattributes
      - .node-version
      - package.json
      - package-lock.json
      - scripts/devcontainer.*
      - scripts/cloud-workspace-doctor.mjs
      - docs/CLOUD_DEVELOPMENT.md
      - docs/GATE_ROUTING.md
      - .github/workflows/devcontainer-contract.yml
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .codex/**
      - .claude/**
      - AGENTS.md
      - CLAUDE.md
      - .github/copilot-instructions.md
      - .gitattributes
      - .node-version
      - package.json
      - package-lock.json
      - scripts/devcontainer.*
      - scripts/cloud-workspace-doctor.mjs
      - docs/CLOUD_DEVELOPMENT.md
      - docs/GATE_ROUTING.md
      - .github/workflows/devcontainer-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Build and verify the cloud workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Create the locked Dev Container
        run: npx --yes @devcontainers/cli@0.88.0 up --workspace-folder .
      - name: Verify the complete toolchain contract
        run: npx --yes @devcontainers/cli@0.88.0 exec --workspace-folder . npm run dev:doctor
